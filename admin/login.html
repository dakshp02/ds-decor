<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
                        META DATA
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DS Decor | Admin Login</title>

    <meta
        name="description"
        content="Secure administrator login for DS Decor.">

    <meta
        name="robots"
        content="noindex,nofollow">

    <!-- =====================================================
                        GOOGLE FONT
    ====================================================== -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet">

    <!-- =====================================================
                        FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- =====================================================
                        STYLESHEET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="login.css">

</head>

<body>

    <!-- =====================================================
                        LOGIN PAGE
    ====================================================== -->

    <main class="login-page">

        <section class="login-container">

            <!-- =====================================================
                            LOGIN CARD
            ====================================================== -->

            <div class="login-card">

                <!-- =====================================================
                                BRAND
                ====================================================== -->

                <div class="login-brand">

                    <div class="brand-logo">

                        <span class="brand-mark">DS</span>

                    </div>

                    <h1>DS Decor</h1>

                    <p>Administrator Panel</p>

                </div>

                <!-- =====================================================
                            LOGIN HEADER
                ====================================================== -->

                <div class="login-header">

                    <h2>

                        Welcome Back 👋

                    </h2>

                    <p>

                        Sign in to manage orders, monitor customer requests,
                        and keep your store running smoothly.

                    </p>

                </div>

                <!-- =====================================================
                            LOGIN FORM
                ====================================================== -->

                <form
                    id="loginForm"
                    class="login-form"
                    novalidate>

                    <!-- =====================================================
                                        EMAIL
                    ====================================================== -->

                    <div class="form-group">

                        <label for="email">

                            Email Address

                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>

                    <!-- =====================================================
                                        PASSWORD
                    ====================================================== -->

                    <div class="form-group">

                        <label for="password">

                            Password

                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="Toggle Password Visibility">

                                <i
                                    id="toggleIcon"
                                    class="fa-regular fa-eye">
                                </i>

                            </button>

                        </div>

                    </div>

                    <!-- =====================================================
                                    LOGIN BUTTON
                    ====================================================== -->

                    <button
                        type="submit"
                        id="loginBtn"
                        class="login-btn">

                        <span id="loginBtnText">

                            Login

                        </span>

                    </button>

                    <!-- =====================================================
                                ERROR MESSAGE
                    ====================================================== -->

                    <p
                        id="errorMessage"
                        class="error-message">

                    </p>

                </form>

                <!-- =====================================================
                            LOGIN FOOTER
                ====================================================== -->

                <div class="login-footer">

                    <a
                        href="../index.html"
                        class="back-home">

                        <i class="fa-solid fa-arrow-left"></i>

                        Back to Website

                    </a>

                    <div class="security-info">

                        <i class="fa-solid fa-shield-halved"></i>

                        <span>

                            Protected by Firebase Authentication

                        </span>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- =====================================================
                        SCRIPT
    ====================================================== -->

    <script
        type="module"
        src="login.js">
    </script>

</body>

</html>
